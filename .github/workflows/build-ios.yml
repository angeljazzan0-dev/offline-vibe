name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Xcode Version
        run: |
          echo "Versiones de Xcode instaladas en el sistema:"
          ls -d /Applications/Xcode*.app
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Seleccionando: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> $GITHUB_ENV
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild iOS Project (Sin Pods automáticos)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Archive (Unsigned)
        run: |
          cd ios
          xcodebuild -workspace "OfflineVibe.xcworkspace" \
            -scheme "OfflineVibe" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "../build/OfflineVibe.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive

      - name: Package Archive to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/OfflineVibe.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r -y OfflineVibe.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineVibe-iOS-IPA
          path: build/OfflineVibe.ipa