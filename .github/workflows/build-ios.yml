name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Purgar Expo 57 y Forzar suite Expo 51
        run: |
          rm -rf node_modules package-lock.json ios
          npm install expo@~51.0.28 expo-file-system@~17.0.1 expo-document-picker@~12.0.2 expo-linking@~6.3.1 expo-status-bar@~1.12.1 react-native@0.74.5 react@18.2.0 react-native-safe-area-context@4.10.5 @types/react@~18.2.79 typescript@~5.3.3 --save --legacy-peer-deps

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Build iOS Archive (Unsigned)
        run: |
          cd ios
          # Si por alguna razon no se genero el workspace, forzar pod install
          if [ ! -d *.xcworkspace ]; then
            pod install
          fi

          # Detectar el nombre real del workspace y del scheme
          WORKSPACE=$(basename $(ls -d *.xcworkspace | head -n 1))
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Compilando workspace detectado: $WORKSPACE con esquema: $SCHEME"

          mkdir -p ../build
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "../build/$SCHEME.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive

      - name: Package Archive to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/*.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r -y OfflineVibe.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineVibe-iOS-IPA
          path: build/OfflineVibe.ipa
