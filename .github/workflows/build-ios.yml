name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Forzar Downgrade a Expo 51 en la Nube
        run: |
          echo "Eliminando rastros de Expo 57..."
          rm -f package-lock.json
          rm -rf node_modules
          echo "Instalando versiones estrictas de Expo 51..."
          npm install expo@~51.0.28 react-native@0.74.5 react@18.2.0 react-native-safe-area-context@4.10.5 @types/react@~18.2.79 typescript@~5.3.3 --legacy-peer-deps
          npx expo install --fix

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Build iOS Archive (Unsigned)
        run: |
          cd ios
          xcodebuild -workspace "OfflineVibe.xcworkspace" \
            -scheme "OfflineVibe" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "../build/OfflineVibe.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive

      - name: Package Archive to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/OfflineVibe.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r -y OfflineVibe.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineVibe-iOS-IPA
          path: build/OfflineVibe.ipa