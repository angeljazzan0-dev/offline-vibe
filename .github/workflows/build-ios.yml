name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Limpieza y Reinstalacion Pura
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Hack - Aniquilar Package.swift
        run: |
          echo "Borrando archivos Package.swift para evadir el escaneo automatico de Xcode..."
          find node_modules -name "Package.swift" -type f -delete
          find ios -name "Package.swift" -type f -delete || true

      - name: Build iOS Archive (Unsigned)
        run: |
          cd ios
          xcodebuild -workspace "OfflineVibe.xcworkspace" \
            -scheme "OfflineVibe" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "../build/OfflineVibe.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive

      - name: Package Archive to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/OfflineVibe.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r -y OfflineVibe.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineVibe-iOS-IPA
          path: build/OfflineVibe.ipa