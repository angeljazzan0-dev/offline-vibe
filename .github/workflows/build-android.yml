name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias purificadas
        run: |
          rm -rf node_modules package-lock.json android
          npm install expo@~51.0.28 expo-file-system@~17.0.1 expo-document-picker@~12.0.2 expo-linking@~6.3.1 expo-status-bar@~1.12.1 react-native@0.74.5 react@18.2.0 react-native-safe-area-context@4.10.5 @nozbe/simdjson@3.9.4 @types/react@~18.2.79 typescript@~5.3.3 --save --legacy-peer-deps

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Inyectar colores de sistema blindados
        run: |
          mkdir -p android/app/src/main/res/values
          cat <<EOF > android/app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="splashscreen_background">#050508</color>
              <color name="colorPrimary">#050508</color>
              <color name="colorPrimaryDark">#050508</color>
              <color name="colorAccent">#8B5CF6</color>
              <color name="iconBackground">#050508</color>
          </resources>
          EOF

      - name: Compilar APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineVibe-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
